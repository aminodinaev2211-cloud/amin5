    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #03050b;
            color: #f3e5ab;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Переключатель языка */
        .lang-switch {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 10;
            display: flex;
            background: rgba(15, 20, 35, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.6);
            border-radius: 20px;
            padding: 3px;
            backdrop-filter: blur(10px);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #b3b3b3;
            padding: 6px 12px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 15px;
            font-family: 'Montserrat', sans-serif;
            transition: 0.3s;
        }

        .lang-btn.active {
            background: #d4af37;
            color: #03050b;
            font-weight: 600;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Секции для прокрутки анимации (первые две пустые, чтобы насладиться космосом) */
        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            text-align: center;
        }

        .scroll-hint {
            position: absolute;
            bottom: 30px;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(212, 175, 55, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(5px); }
            100% { opacity: 0.3; transform: translateY(0); }
        }
